<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>e-Class 다크 테마</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="heading">
        <div>
          <h1>e-Class 다크 테마</h1>
          <p id="statusText">상태를 불러오는 중…</p>
        </div>

        <label class="switch" aria-label="다크 모드 켜기 또는 끄기">
          <input id="darkModeToggle" type="checkbox" disabled />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>

      <p class="hint">설정은 저장되며 열린 e-Class 페이지에 즉시 적용됩니다.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
